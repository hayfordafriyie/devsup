<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DevSup Dashboard</title>
    <link rel="stylesheet" href="/dashboard/style.css" />
</head>
<body>
    <header>
        <h1>DevSup Dashboard</h1>
        <div id="session">
            <input id="token" type="password" placeholder="Paste your API token" autocomplete="off" />
            <button id="connect">Connect</button>
            <button id="refresh" hidden>Refresh</button>
            <span id="session-user"></span>
        </div>
    </header>

    <main>
        <section id="cards" class="cards" hidden></section>

        <section id="repositories-section" class="panel" hidden>
            <h2>Repositories</h2>
            <table id="repositories">
                <thead>
                    <tr>
                        <th>Repository</th>
                        <th>App URL</th>
                        <th>Status</th>
                        <th>Last checked</th>
                        <th>Last error</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="tickets-section" class="panel" hidden>
            <h2>Repair tickets</h2>
            <table id="tickets">
                <thead>
                    <tr>
                        <th>Repository</th>
                        <th>Request</th>
                        <th>Status</th>
                        <th>Category</th>
                        <th>Patch</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="webhooks-section" class="panel" hidden>
            <h2>Webhook endpoints</h2>
            <ul id="webhooks"></ul>
            <form id="webhook-form">
                <input id="webhook-url" type="url" placeholder="https://hooks.example.com/devsup" />
                <button type="submit">Add webhook</button>
            </form>
        </section>
    </main>

    <div id="error" class="error" hidden></div>

    <script src="/dashboard/app.js"></script>
</body>
</html>
